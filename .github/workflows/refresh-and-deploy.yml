name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"      # daily at 09:17 UTC (4:17 am EST / 5:17 am EDT); GitHub often starts it hours late
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live endpoints (diagnostic)
        continue-on-error: true
        timeout-minutes: 3
        run: python pipeline/probe.py 2>&1 | tee pipeline/cache/probe.txt
      - name: Rebuild data from the newest public releases
        id: refresh
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        timeout-minutes: 18
        run: |
          set -o pipefail
          python pipeline/refresh.py 2>&1 | tee pipeline/cache/refresh_log.txt
      - name: Food help, harbor water, neighborhood trends and transit schedules
        id: extras
        continue-on-error: true
        timeout-minutes: 14
        run: python pipeline/extras.py
      - name: Code Blue / Code Red, water notices and air sensors
        id: alerts
        continue-on-error: true
        timeout-minutes: 3
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python pipeline/city_alerts.py
      - name: Fetch and enhance photos in 4K (Wikimedia Commons, once per photo)
        id: photos
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install --quiet pillow
          python pipeline/images.py
      - name: Record build health
        if: always()
        run: |
          python - <<'PY'
          import json, datetime
          steps = {"refresh": "${{ steps.refresh.outcome }}", "extras": "${{ steps.extras.outcome }}", "alerts": "${{ steps.alerts.outcome }}", "photos": "${{ steps.photos.outcome }}"}
          json.dump({"built": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes"),
                     "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "steps": steps},
                    open("site/data/health.json", "w"), indent=1)
          PY
      - name: Test every page before publishing
        id: tests
        timeout-minutes: 14
        run: |
          rm -rf /tmp/pub && cp -r site /tmp/pub
          (cd /tmp/pub && python -m http.server 8765 >/dev/null 2>&1 &)
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
          node tests/smoke.mjs http://localhost:8765/ || (sleep 20 && node tests/smoke.mjs http://localhost:8765/)
      - name: Commit refreshed data to main
        id: commit
        run: |
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/img pipeline/cache
          if ! git diff --cached --quiet; then
            git commit -m "Data refresh $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - name: Publish site to gh-pages (GitHub Pages)
        id: publish
        run: |
          BUILD=$(date -u +%Y%m%d%H%M)
          rm -rf /tmp/pub && cp -r site /tmp/pub
          sed -i "s/__BUILD__/$BUILD/g" /tmp/pub/sw.js /tmp/pub/index.html
          cd /tmp/pub
          git init -q -b gh-pages
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Deploy $BUILD"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Email an alert if anything failed (opens a GitHub issue; closes it when healthy)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME_REFRESH: ${{ steps.refresh.outcome }}
          OUTCOME_EXTRAS: ${{ steps.extras.outcome }}
          OUTCOME_ALERTS: ${{ steps.alerts.outcome }}
          OUTCOME_PHOTOS: ${{ steps.photos.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
          OUTCOME_PUBLISH: ${{ steps.publish.outcome }}
        run: python pipeline/notify.py build
