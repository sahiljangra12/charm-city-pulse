name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"      # daily, 5:17 am Baltimore (EDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live endpoints (diagnostic)
        continue-on-error: true
        run: python pipeline/probe.py 2>&1 | tee pipeline/cache/probe.txt
      - name: Rebuild data from the newest public releases
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          set -o pipefail
          python pipeline/refresh.py 2>&1 | tee pipeline/cache/refresh_log.txt
      - name: Commit refreshed data to main
        run: |
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data pipeline/cache
          if ! git diff --cached --quiet; then
            git commit -m "Data refresh $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - name: Publish site to gh-pages (GitHub Pages)
        run: |
          BUILD=$(date -u +%Y%m%d%H%M)
          rm -rf /tmp/pub && cp -r site /tmp/pub
          sed -i "s/__BUILD__/$BUILD/g" /tmp/pub/sw.js /tmp/pub/index.html
          cd /tmp/pub
          git init -q -b gh-pages
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Deploy $BUILD"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
