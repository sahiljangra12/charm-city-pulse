name: Check Code Blue and Code Red

# Hourly: reads the Baltimore City Health Department's announcements and republishes the site
# only when a Code Blue or Code Red starts, changes or ends.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Health Department's alerts
        timeout-minutes: 2
        run: python pipeline/city_alerts.py
      - name: Publish if anything changed
        run: |
          if git diff --quiet site/data/city_alerts.json; then echo "No change"; exit 0; fi
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/city_alerts.json
          git commit -m "City alert update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
          BUILD=$(date -u +%Y%m%d%H%M)
          rm -rf /tmp/pub && cp -r site /tmp/pub
          sed -i "s/__BUILD__/$BUILD/g" /tmp/pub/sw.js /tmp/pub/index.html
          cd /tmp/pub
          git init -q -b gh-pages
          git config user.name "charm-city-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Deploy $BUILD (city alert)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
